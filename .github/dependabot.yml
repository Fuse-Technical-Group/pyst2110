# Dependabot version-update PRs. Complements (does not replace) Dependabot
# security updates, which open PRs for vulnerability alerts independently.
version: 2
updates:
  # Python dependencies resolved by uv (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # A release has a week to draw a follow-up fix before it is proposed.
    cooldown:
      default-days: 7
    # ruff and pyright bring new findings that need code edits, so they
    # land apart from the library bumps.
    groups:
      python-lint:
        patterns: ["ruff", "pyright"]
      uv-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["ruff", "pyright"]
        update-types: [minor, patch]
    # `build(deps):` keeps the PR out of flywheel's auto_merge types
    # (.flywheel.yml), so a bump waits for a human review.
    commit-message:
      prefix: build
      include: scope

  # Actions are SHA-pinned with a trailing version comment; Dependabot bumps
  # the SHA and rewrites the comment. The notation reusable workflow is pinned
  # to a notation--v* tag, which Dependabot does not track — bump that by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
