[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyst2110"
# Derived from the git tag, never authored here. A static version is one a
# release has to remember to rewrite, and this one's releases did not: every
# tag from v0.4.0 to v0.7.1 shipped `0.0.0`, so `importlib.metadata.version`
# told a consumer nothing about which parse it had loaded — which is what
# `bm.nodes._st2110_backend.loaded_pyst2110` had to work around by reading a
# capability instead. See [tool.hatch.version].
dynamic = ["version"]
description = "SMPTE ST 2110 protocol: RTP and RFC 4175 headers, geometry, SDP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
# The only runtime dependency, and the interface itself: every parse takes
# and returns numpy arrays (SPEC §spec:interface-shape). No transport
# binding and no SDK appears here, by design (§spec:scope-boundary).
dependencies = ["numpy>=2"]

[project.urls]
Repository = "https://github.com/Fuse-Technical-Group/pyst2110"

[dependency-groups]
dev = [
    "pytest>=8",
    # Pinned, not floored: a newer ruff than CI runs is precisely the
    # disagreement a pin exists to prevent.
    "ruff==0.15.9",
    # py.typed promises downstream consumers type information; this checks it.
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyst2110"]

[tool.pytest.ini_options]
# No markers and no deselection: nothing here needs a NIC, a licence or an
# SDK, so the default selection is the whole suite (SPEC §spec:testing).
testpaths = ["tests"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "S",   # bandit
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is what pytest is made of

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pyst2110"]
